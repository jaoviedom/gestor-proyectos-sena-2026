{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Proyectos · Bienvenida</title>
  <!-- Tailwind CSS v3 (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- (Opcional) Font Awesome para un toque sutil, sin clases personalizadas -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-indigo-100/60 p-4">

  <!-- Tarjeta principal: solo bienvenida, diseño moderno, únicamente Tailwind -->
  <div class="max-w-2xl w-full bg-white/80 backdrop-blur-sm shadow-2xl rounded-3xl p-8 md:p-12 text-center border border-white/40 transition-all hover:shadow-indigo-200/50 duration-300">

    <!-- Icono decorativo (Font Awesome) sin clases personalizadas -->
    <div class="flex justify-center mb-6">
      <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center shadow-inner">
        <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-20 h-20 rounded-full">
      </div>
    </div>

    <!-- Título principal -->
    <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600 tracking-tight">
      Gestor de Proyectos
    </h1>

    <!-- Línea divisoria sutil -->
    <div class="w-24 h-1 bg-gradient-to-r from-indigo-400 to-violet-400 mx-auto my-5 rounded-full"></div>

    <!-- Mensaje de bienvenida cálido y moderno -->
    <p class="text-lg md:text-xl text-slate-700 font-light leading-relaxed">
      <span class="font-medium text-indigo-700">Bienvenido</span> a tu espacio central para organizar, seguir y <br class="hidden sm:block" />
      hacer crecer tus proyectos con claridad y enfoque.
    </p>

    <!-- Toque final: badge sutil con "v1.0" (solo estética) -->
     <a href="{% url 'proyectos' %}">
       <div class="mt-8 inline-flex items-center gap-2 bg-indigo-50/70 px-5 py-2 rounded-full border border-indigo-100/60 text-sm text-indigo-700 font-medium shadow-sm">
         <i class="fa-regular fa-compass text-indigo-400"></i>
         <span>Empieza ahora</span>
         <i class="fa-solid fa-arrow-right text-indigo-400 text-xs"></i>
       </div>
     </a>

    <!-- Nota: solo bienvenida, sin más contenido -->
    <div class="mt-6 text-xs text-slate-400/80 font-mono tracking-wider uppercase">
      · gestión ágil · visión clara ·
    </div>
  </div>

</body>
</html>
