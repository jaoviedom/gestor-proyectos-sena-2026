{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor de Proyectos{% endblock %}</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Solo estilos base para el cuerpo y transiciones suaves */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
        }
        /* Transición suave para el navbar */
        .nav-link {
            transition: all 0.15s ease;
        }
        .nav-link:hover {
            transform: translateY(-1px);
        }
        /* Iconos SVG inline de Tailwind 4 (Heroicons) */
        .icon {
            width: 1.25rem;
            height: 1.25rem;
            flex-shrink: 0;
        }
        .icon-sm {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
        }
        .proyecto-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .proyecto-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
        }
        .about-card {
            transition: box-shadow 0.15s ease, transform 0.1s ease;
        }
        .about-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.02);
            transform: translateY(-1px);
        }
        .enlace-accion {
            transition: color 0.15s, background-color 0.15s;
        }
        .enlace-accion:hover {
            background-color: #f1f5f9;
        }
        .form-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .form-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
        }
        /* Estilo para los campos del formulario */
        input, textarea {
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="antialiased text-slate-700 min-h-screen flex flex-col">

    <!-- Navbar minimalista con iconos Tailwind 4 -->
    <nav class="bg-white/80 backdrop-blur-sm border-b border-slate-200/60 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo y marca -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-md">
                            <!-- Icono Folder (Heroicons) -->
                            <!-- <svg class="icon text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
                            </svg> -->
                            <img src="{% static 'img/logo.png' %}" alt="Logo" class="p-1">
                        </div>
                        <span class="text-lg font-semibold text-slate-800 tracking-tight hidden sm:block">
                            Gestor de Proyectos
                        </span>
                    </div>
                </div>

                <!-- Enlaces de navegación -->
                <div class="flex items-center gap-1 sm:gap-2">
                    <a href="{% url 'home' %}" 
                       class="nav-link inline-flex items-center gap-1.5 px-3 sm:px-4 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 rounded-lg transition-all">
                        <!-- Icono Home (Heroicons) -->
                        <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                        </svg>
                        <span class="hidden xs:inline">Inicio</span>
                    </a>
                    <a href="{% url 'proyectos' %}" 
                       class="nav-link inline-flex items-center gap-1.5 px-3 sm:px-4 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 rounded-lg transition-all">
                        <!-- Icono Clipboard (Heroicons) -->
                        <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
                        </svg>
                        <span class="hidden xs:inline">Proyectos</span>
                    </a>
                    <a href="{% url 'nuevo_proyecto' %}" 
                      class="nav-link inline-flex items-center gap-1.5 px-3 sm:px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-all shadow-sm hover:shadow">
                        <!-- Icono Plus (Heroicons) - más adecuado para "Nuevo proyecto" -->
                        <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        <span class="hidden xs:inline">Nuevo proyecto</span>
                    </a>
                    
                    <!-- Separador -->
                    <span class="w-px h-6 bg-slate-200 mx-1 hidden sm:block"></span>
                    
                    <a href="{% url 'acerca_de' %}" 
                       class="nav-link inline-flex items-center gap-1.5 px-3 sm:px-4 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 rounded-lg transition-all">
                        <!-- Icono Information Circle (Heroicons) -->
                        <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11.25 11.25l.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                        </svg>
                        <span class="hidden sm:inline">Acerca de</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer minimalista -->
    <footer class="mt-auto border-t border-slate-200/60 bg-white/50 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-400">
                <span class="flex items-center gap-2">
                    <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21v-6m0 0-3-3m3 3 3-3M3 9.75a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 .75.75v.75a.75.75 0 0 1-.75.75H3.75a.75.75 0 0 1-.75-.75V9.75ZM21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    2026 · Gestor de Proyectos
                </span>
                <span class="flex items-center gap-3">
                    <span class="flex items-center gap-1">
                        <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                        Jose Oviedo
                    </span>
                    <span class="hidden sm:inline text-slate-300">|</span>
                    <span class="hidden sm:flex items-center gap-1">
                        <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6h1.5m-1.5 3h1.5m-1.5 3h1.5M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
                        </svg>
                        SENA · Centro de Comercio y Servicios
                    </span>
                </span>
            </div>
        </div>
    </footer>

</body>
</html>
